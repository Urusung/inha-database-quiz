const TYPE_LABEL = { choice: '객관식', multi: '복수선택', ox: 'OX', short: '단답형', essay: '서술형' };
const TYPE_ORDER = ['choice', 'multi', 'ox', 'short', 'essay'];
const SOURCE_LABEL = { all: '전체 시험범위', final: '기말고사', past: '작년 기말 제보', query: '쿼리 암기', midterm: '중간고사' };
const SOURCE_ORDER = ['final', 'past', 'query', 'midterm'];
const CHAPTERS = [...new Set(POOL.map(q => q.chapter))].sort((a, b) => Number(a) - Number(b));
const MIDTERM_CHECK_IDS = new Set([
  "c6-001",
  "c6-002",
  "c6-005",
  "c6-006"
]);
const MIDTERM_LECTURE_IDS = new Set([
  "l6-001",
  "l6-002",
  "l6-003",
  "l6-004",
  "l6-006",
  "l6-007",
  "l6-008",
  "l6-009",
  "l6-010",
  "l6-011",
  "l6-012"
]);

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
const escapeHtml = (s) => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function normalize(s) {
  return String(s).toLowerCase().replace(/\s+/g,'').replace(/[.,;:·ㆍ|\/\\_\-()\[\]{}'"`]/g,'');
}
function typeLabel(type) { return TYPE_LABEL[type] || type; }
function typeClass(type) { return 'type-' + type; }
function isAutoGraded(q) { return q.type !== 'essay'; }
function isMidtermQuestion(q) {
  if ((q.bank === 'check' || q.bank === 'lecture') && Number(q.chapter) <= 5) return true;
  if (MIDTERM_CHECK_IDS.has(q.id) || MIDTERM_LECTURE_IDS.has(q.id)) return true;
  return q.bank === 'extra' && q.chapter === '4';
}
function isFinalQuestion(q) {
  return q.bank === 'final' || q.bank === 'query' || q.bank === 'past' || q.source === '체크문제(7)';
}
function sourceMatches(q, source) {
  if (source === 'all') return isMidtermQuestion(q) || isFinalQuestion(q);
  if (source === 'midterm') return isMidtermQuestion(q);
  if (source === 'final') return isFinalQuestion(q);
  if (source === 'past') return q.bank === 'past';
  if (source === 'query') return q.bank === 'query';
  return false;
}

const state = {
  questions: [],
  answers: {},
  revealed: {},
  correct: {},
  sourceFilter: 'final',
  chapterFilter: 'all',
  typeFilter: 'all',
  countMode: '20',
};

function filteredCount({ source = state.sourceFilter, chapter = state.chapterFilter, type = state.typeFilter } = {}) {
  return POOL.filter(q => {
    const bySource = sourceMatches(q, source);
    const byChapter = chapter === 'all' || q.chapter === chapter;
    const byType = type === 'all' || q.type === type;
    return bySource && byChapter && byType;
  }).length;
}

function currentPool() {
  return POOL.filter(q => {
    const bySource = sourceMatches(q, state.sourceFilter);
    const byChapter = state.chapterFilter === 'all' || q.chapter === state.chapterFilter;
    const byType = state.typeFilter === 'all' || q.type === state.typeFilter;
    return bySource && byChapter && byType;
  });
}

function buildSet({ excludeIds = new Set() } = {}) {
  const pool = currentPool();
  const candidates = excludeIds.size ? pool.filter(q => !excludeIds.has(q.id)) : pool;
  if (state.countMode === 'all') {
    return candidates.slice().sort((a, b) => a.id.localeCompare(b.id, 'ko'));
  }
  return shuffle(candidates).slice(0, Math.min(Number(state.countMode), candidates.length));
}

function newRound({ excludeCurrent = false } = {}) {
  const excludeIds = excludeCurrent ? new Set(state.questions.map(q => q.id)) : new Set();
  const nextQuestions = buildSet({ excludeIds });
  if (excludeCurrent && state.questions.length && !nextQuestions.length) {
    alert('현재 조건에서는 방금 푼 문제를 제외하고 새로 출제할 문제가 없습니다. 자료, 장, 유형 필터를 넓혀주세요.');
    return;
  }
  state.questions = nextQuestions;
  state.answers = {};
  state.revealed = {};
  state.correct = {};
  document.getElementById('result-card').classList.remove('show');
  renderFilters();
  renderMode();
  renderPoolInfo();
  render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function arrayEqualAsSet(a, b) {
  if (!Array.isArray(a) || !Array.isArray(b) || a.length !== b.length) return false;
  const aa = a.slice().sort((x, y) => x - y);
  const bb = b.slice().sort((x, y) => x - y);
  return aa.every((v, i) => v === bb[i]);
}

function isCorrect(q, ans) {
  if (ans === undefined || ans === null || ans === '') return false;
  if (q.type === 'choice') return ans === q.answer;
  if (q.type === 'multi') return arrayEqualAsSet(ans, q.answer);
  if (q.type === 'ox') return ans === q.answer;
  if (q.type === 'short') {
    const na = normalize(ans);
    const pool = [q.answer, ...(q.alts || [])].map(normalize);
    return pool.includes(na);
  }
  return false;
}

function answerText(q) {
  if (q.type === 'choice') return `${q.answer + 1}. ${q.choices[q.answer]}`;
  if (q.type === 'multi') return q.answer.map(i => `${i + 1}. ${q.choices[i]}`).join(' / ');
  return q.answer;
}

}

function render() {
  const container = document.getElementById('quiz-container');
  if (!state.questions.length) {
    container.innerHTML = '<div class="question-card"><p class="q-text">선택한 조건에 맞는 문제가 없습니다.</p></div>';
    updateProgress();
    return;
  }

  container.innerHTML = state.questions.map((q, i) => {
    const revealed = !!state.revealed[i];
    const correct = !!state.correct[i];
    const cardClass = revealed
      ? (q.type === 'essay' ? 'answered-review' : (correct ? 'answered-correct' : 'answered-wrong'))
      : '';

    let body = '';
    if (q.type === 'choice') {
      const selected = state.answers[i];
      body = '<div class="choices">' + q.choices.map((choice, ci) => {
        let cls = 'choice';
        if (revealed) { cls += ' disabled'; if (ci === q.answer) cls += ' correct'; else if (ci === selected) cls += ' wrong'; }
        else if (selected === ci) cls += ' selected';
        return `<div class="${cls}" data-qi="${i}" data-ci="${ci}"><div class="choice-num">${ci + 1}</div><div class="choice-text">${escapeHtml(choice)}</div></div>`;
      }).join('') + '</div>';
    } else if (q.type === 'multi') {
      const selected = state.answers[i] || [];
      body = '<div class="choices">' + q.choices.map((choice, ci) => {
        let cls = 'choice';
        if (revealed) { cls += ' disabled'; if (q.answer.includes(ci)) cls += ' correct'; else if (selected.includes(ci)) cls += ' wrong'; }
        else if (selected.includes(ci)) cls += ' selected';
        return `<div class="${cls}" data-qi="${i}" data-mi="${ci}"><div class="choice-num">${selected.includes(ci) ? '✓' : ci + 1}</div><div class="choice-text">${escapeHtml(choice)}</div></div>`;
      }).join('') + '</div>';
      body += `<button class="multi-submit" data-qi="${i}" ${revealed ? 'disabled' : ''}>복수선택 제출</button>`;
    } else if (q.type === 'ox') {
      const selected = state.answers[i];
      const mk = (value) => {
        let cls = 'ox-btn';
        if (revealed) { cls += ' disabled'; if (value === q.answer) cls += ' correct'; else if (value === selected) cls += ' wrong'; }
        else if (selected === value) cls += ' selected';
        return `<button class="${cls}" data-qi="${i}" data-ox="${value}">${value}</button>`;
      };
      body = `<div class="ox-choices">${mk('O')}${mk('X')}</div>`;
    } else if (q.type === 'short') {
      const value = state.answers[i] ?? '';
      const inputClass = revealed ? (correct ? 'correct' : 'wrong') : '';
      body = `<div class="short-row">
        <input type="text" class="short-input ${inputClass}" data-qi="${i}" value="${escapeHtml(value)}" placeholder="답을 입력하고 Enter 또는 제출" ${revealed ? 'disabled' : ''}>
        <button class="short-submit" data-qi="${i}" ${revealed ? 'disabled' : ''}>제출</button>
      </div>`;
    } else if (q.type === 'essay') {
      const value = state.answers[i] ?? '';
      const inputClass = revealed ? 'reviewed' : '';
      body = `<textarea class="essay-input ${inputClass}" data-qi="${i}" placeholder="답안을 작성하고 모범답안을 확인하세요." ${revealed ? 'disabled' : ''}>${escapeHtml(value)}</textarea>
        <button class="essay-submit" data-qi="${i}" ${revealed ? 'disabled' : ''}>모범답안 확인</button>`;
    }

    const explain = revealed ? `
      <div class="explain show">
        <span class="explain-label">${q.type === 'essay' ? '모범답안' : (correct ? '✅ 정답!' : '❌ 오답')}</span>
        ${escapeHtml(q.explanation || '')}
        <span class="ans-line">${q.type === 'essay' ? '모범답안' : '📖 정답'}: ${escapeHtml(answerText(q))}</span>
        ${renderDiagram(q.diagram)}
      </div>` : '';

    return `
      <div class="question-card ${cardClass}" id="q-${i}">
        <div class="q-header">
          <span class="q-num">Q${i + 1}</span>
          <span class="q-tag ${typeClass(q.type)}">${typeLabel(q.type)}</span>
          <span class="q-tag">${q.chapter}장</span>
          <span class="q-tag">${escapeHtml(q.source)}</span>
        </div>
        <div class="q-text">${escapeHtml(q.question)}</div>
        ${renderQuestionImage(q)}
        ${renderQuestionFigure(q.figure)}
        ${body}
        ${explain}
      </div>`;
  }).join('');

  container.querySelectorAll('.choice[data-ci]').forEach(el => {
    if (el.classList.contains('disabled')) return;
    el.addEventListener('click', () => {
      const qi = Number(el.dataset.qi);
      const ci = Number(el.dataset.ci);
      state.answers[qi] = ci;
      state.revealed[qi] = true;
      state.correct[qi] = isCorrect(state.questions[qi], ci);
      render();
    });
  });

  container.querySelectorAll('.choice[data-mi]').forEach(el => {
    if (el.classList.contains('disabled')) return;
    el.addEventListener('click', () => {
      const qi = Number(el.dataset.qi);
      const mi = Number(el.dataset.mi);
      const selected = new Set(state.answers[qi] || []);
      if (selected.has(mi)) selected.delete(mi);
      else selected.add(mi);
      state.answers[qi] = [...selected].sort((a, b) => a - b);
      render();
    });
  });

  container.querySelectorAll('.multi-submit').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', () => {
      const qi = Number(btn.dataset.qi);
      const selected = state.answers[qi] || [];
      if (selected.length === 0) {
        alert('정답을 하나 이상 선택하세요.');
        return;
      }
      state.revealed[qi] = true;
      state.correct[qi] = isCorrect(state.questions[qi], selected);
      render();
    });
  });

  container.querySelectorAll('.ox-btn').forEach(btn => {
    if (btn.classList.contains('disabled')) return;
    btn.addEventListener('click', () => {
      const qi = Number(btn.dataset.qi);
      const value = btn.dataset.ox;
      state.answers[qi] = value;
      state.revealed[qi] = true;
      state.correct[qi] = isCorrect(state.questions[qi], value);
      render();
    });
  });

  container.querySelectorAll('.short-input').forEach(input => {
    if (input.disabled) return;
    input.addEventListener('input', () => {
      state.answers[Number(input.dataset.qi)] = input.value;
    });
    input.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        event.preventDefault();
        submitShort(Number(input.dataset.qi));
      }
    });
  });

  container.querySelectorAll('.short-submit').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', () => submitShort(Number(btn.dataset.qi)));
  });

  container.querySelectorAll('.essay-input').forEach(input => {
    if (input.disabled) return;
    input.addEventListener('input', () => {
      state.answers[Number(input.dataset.qi)] = input.value;
    });
  });

  container.querySelectorAll('.essay-submit').forEach(btn => {
    if (btn.disabled) return;
    btn.addEventListener('click', () => submitEssay(Number(btn.dataset.qi)));
  });

  updateProgress();
}

function submitShort(qi) {
  const value = state.answers[qi] ?? '';
  state.revealed[qi] = true;
  state.correct[qi] = isCorrect(state.questions[qi], value);
  render();
}

function submitEssay(qi) {
  state.revealed[qi] = true;
  state.correct[qi] = null;
  render();
}

function updateProgress() {
  const total = state.questions.length;
  const answered = Object.keys(state.revealed).length;
  const correct = state.questions
    .map((q, i) => ({ q, i }))
    .filter(x => isAutoGraded(x.q) && state.correct[x.i] === true)
    .length;
  document.getElementById('progress-text').textContent = `${answered} / ${total}`;
  document.getElementById('progress-fill').style.width = total ? `${(answered / total) * 100}%` : '0%';
  document.getElementById('score-badge').textContent = `정답 ${correct}`;
}

function renderMode() {
  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.count === state.countMode);
  });
}

function renderFilters() {
  const sourceBar = document.getElementById('source-filter');
  const sourceItems = ['all', ...SOURCE_ORDER];
  sourceBar.innerHTML = '<span class="mode-label">범위:</span>' + sourceItems.map(source => {
    const n = filteredCount({ source });
    const label = `${SOURCE_LABEL[source]} (${n})`;
    const cls = state.sourceFilter === source ? 'filter-btn active' : 'filter-btn';
    return `<button class="${cls}" data-source="${source}">${label}</button>`;
  }).join('');

  const chapterBar = document.getElementById('chapter-filter');
  const visibleChapters = CHAPTERS.filter(ch => filteredCount({ chapter: ch }) > 0 || state.chapterFilter === ch);
  const chapterItems = ['all', ...visibleChapters];
  chapterBar.innerHTML = '<span class="mode-label">장:</span>' + chapterItems.map(ch => {
    const n = filteredCount({ chapter: ch });
    const label = ch === 'all' ? `전체 (${n})` : `${ch}장 (${n})`;
    const cls = state.chapterFilter === ch ? 'filter-btn active' : 'filter-btn';
    return `<button class="${cls}" data-chapter="${ch}">${label}</button>`;
  }).join('');

  const typeBar = document.getElementById('type-filter');
  const typeItems = ['all', ...TYPE_ORDER];
  typeBar.innerHTML = '<span class="mode-label">유형:</span>' + typeItems.map(type => {
    const n = filteredCount({ type });
    const label = type === 'all' ? `전체 유형 (${n})` : `${typeLabel(type)} (${n})`;
    const cls = state.typeFilter === type ? 'filter-btn active' : 'filter-btn';
    return `<button class="${cls}" data-type="${type}">${label}</button>`;
  }).join('');

  sourceBar.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (hasProgress() && !confirm('시험 범위를 바꾸면 현재 답안이 사라집니다. 진행할까요?')) return;
      state.sourceFilter = btn.dataset.source;
      state.chapterFilter = 'all';
      newRound();
    });
  });
  chapterBar.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (hasProgress() && !confirm('필터를 바꾸면 현재 답안이 사라집니다. 진행할까요?')) return;
      state.chapterFilter = btn.dataset.chapter;
      newRound();
    });
  });
  typeBar.querySelectorAll('.filter-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (hasProgress() && !confirm('필터를 바꾸면 현재 답안이 사라집니다. 진행할까요?')) return;
      state.typeFilter = btn.dataset.type;
      newRound();
    });
  });
}

function renderPoolInfo() {
  const info = document.getElementById('pool-info');
  const selected = currentPool();
  const bySource = (source) => POOL.filter(q => sourceMatches(q, source)).length;
  const byType = (type) => selected.filter(q => q.type === type).length;
  const sourceCounts = SOURCE_ORDER.map(source => `${SOURCE_LABEL[source]} ${bySource(source)}`).join(' / ');
  info.textContent = `문제 풀: 전체 시험범위 ${bySource('all')}문제 (${sourceCounts}) · 현재 ${SOURCE_LABEL[state.sourceFilter]} ${selected.length}문제 (객관식 ${byType('choice')} / 복수선택 ${byType('multi')} / OX ${byType('ox')} / 단답형 ${byType('short')} / 서술형 ${byType('essay')})`;
}

function hasProgress() {
  return Object.keys(state.revealed).length > 0 || Object.keys(state.answers).length > 0;
}

document.getElementById('mode-bar').addEventListener('click', (event) => {
  const btn = event.target.closest('.mode-btn');
  if (!btn) return;
  if (btn.dataset.count === state.countMode) return;
  if (hasProgress() && !confirm('출제 방식을 바꾸면 현재 답안이 사라집니다. 진행할까요?')) return;
  state.countMode = btn.dataset.count;
  newRound();
});

document.getElementById('submit-btn').addEventListener('click', () => {
  const total = state.questions.length;
  const answered = Object.keys(state.revealed).length;
  const entries = state.questions.map((q, i) => ({ q, i }));
  const autoGraded = entries.filter(x => isAutoGraded(x.q));
  const essayItems = entries.filter(x => x.q.type === 'essay');
  const correct = autoGraded.filter(x => state.correct[x.i] === true).length;
  const reviewedEssays = essayItems.filter(x => state.revealed[x.i]).length;
  const percent = autoGraded.length ? Math.round((correct / autoGraded.length) * 100) : 0;
  const essayDetail = essayItems.length ? ` · 서술형 확인 ${reviewedEssays}/${essayItems.length}` : '';

  document.getElementById('result-score').textContent = autoGraded.length ? `${correct} / ${autoGraded.length}` : `서술형 ${reviewedEssays} / ${essayItems.length}`;
  document.getElementById('result-detail').textContent = autoGraded.length
    ? `채점 완료 ${answered}/${total}문항 · 자동채점 정답률 ${percent}%${essayDetail}`
    : `모범답안 확인 ${reviewedEssays}/${essayItems.length}문항`;

  let msg;
  if (!autoGraded.length) msg = '서술형은 모범답안의 핵심어와 본인 답안을 직접 대조하세요.';
  else if (percent >= 90) msg = '핵심 개념이 안정적으로 잡혀 있습니다.';
  else if (percent >= 75) msg = '오답 문항의 용어 구분만 다시 확인하세요.';
  else if (percent >= 60) msg = '장별 필터로 약한 범위를 따로 반복하는 편이 좋습니다.';
  else msg = '정의, 특성, 키, 설계 단계부터 다시 정리하세요.';
  document.getElementById('result-message').textContent = msg;

  const breakdown = TYPE_ORDER.map(type => {
    const qs = state.questions.map((q, i) => ({ q, i })).filter(x => x.q.type === type);
    if (!qs.length) return '';
    if (type === 'essay') {
      const reviewed = qs.filter(x => state.revealed[x.i]).length;
      return `<span>${typeLabel(type)} 확인 ${reviewed}/${qs.length}</span>`;
    }
    const c = qs.filter(x => state.correct[x.i]).length;
    return `<span>${typeLabel(type)} ${c}/${qs.length}</span>`;
  }).filter(Boolean).join('');
  document.getElementById('result-breakdown').innerHTML = breakdown;

  const card = document.getElementById('result-card');
  card.classList.add('show');
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
});

document.getElementById('reset-btn').addEventListener('click', () => {
  if (hasProgress() && !confirm('새 문제로 바꾸면 현재 답안이 사라집니다. 진행할까요?')) return;
  newRound({ excludeCurrent: true });
});

renderPoolInfo();
newRound();
</script>
</body>
</html>
